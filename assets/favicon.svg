<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Nemo Dash icon">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d4a6e"/>
      <stop offset="1" stop-color="#031c2e"/>
    </linearGradient>
    <linearGradient id="fbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc25e"/>
      <stop offset="0.5" stop-color="#ff8c2e"/>
      <stop offset="1" stop-color="#d94f10"/>
    </linearGradient>
    <clipPath id="fclip">
      <ellipse cx="32" cy="34" rx="20" ry="12"/>
    </clipPath>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#fbg)"/>
  <polygon points="12,1 20,1 30,63 18,63" fill="#ffffff" opacity="0.08"/>
  <!-- tail -->
  <polygon points="15,34 4,26 4,42" fill="#e2571b"/>
  <!-- dorsal -->
  <polygon points="24,24 32,15 39,23" fill="#c43d08"/>
  <!-- body -->
  <ellipse cx="32" cy="34" rx="20" ry="12" fill="url(#fbody)"/>
  <g clip-path="url(#fclip)">
    <ellipse cx="38" cy="34" rx="6" ry="13" fill="#1a1a1a"/>
    <ellipse cx="38" cy="34" rx="4" ry="13" fill="#ffffff"/>
  </g>
  <!-- eye -->
  <circle cx="45" cy="30" r="4.6" fill="#ffffff"/>
  <circle cx="46.4" cy="30" r="2.3" fill="#101418"/>
  <circle cx="47.2" cy="29.2" r="0.8" fill="#ffffff"/>
  <!-- bubbles -->
  <g stroke="#c8f0ff" stroke-width="1.6" fill="rgba(200,240,255,0.1)">
    <circle cx="52" cy="14" r="3"/>
    <circle cx="57" cy="24" r="2"/>
  </g>
</svg>
